[package]
name = "solwork"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solwork"

[features]
no-entrypoint = []
no-idl = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.29.0"
anchor-spl = "0.29.0"
solana-program = "=1.18.26"
borsh = "=1.2.1"
indexmap = "=2.2.6"
hashbrown = "=0.14.5"
blake3 = "=1.5.0"
cpufeatures = "=0.2.17"
zeroize_derive = "=1.4.2"
jobserver = "=0.1.32"
crypto-common = "=0.1.6"

[patch.crates-io]
cpufeatures = { path = "./cpufeatures_mock" }
